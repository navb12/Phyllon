<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="toast" role="status"></div>
<script>
/* Data model (print-ready): Page = {id, bookId, rating, moods[], text, quote, paper, stickers[], hand, vis, date}.
   Every page renders at a fixed 5:7 ratio, so a future export maps 1 page = 1 printed sheet. Swap load/save for an API later. */
const BRAND="Phyllon";/* change the product name here */document.title=BRAND+": a reading life, kept";
const B=[
{id:1,t:"Piranesi",a:"Susanna Clarke",c:["#294638","#122219"],m:["Haunted","Wistful","Hopeful"],d:"A man lives in an endless house of statues and tides, and keeps a very careful journal."},
{id:2,t:"The Secret History",a:"Donna Tartt",c:["#6E2F26","#2f1310"],m:["Haunted","Restless"],d:"Six classics students, one decision they cannot take back."},
{id:3,t:"Rebecca",a:"Daphne du Maurier",c:["#6A6944","#26261a"],m:["Haunted","Restless"],d:"The second Mrs de Winter walks through rooms still arranged for someone else."},
{id:4,t:"Klara and the Sun",a:"Kazuo Ishiguro",c:["#B85F43","#5a2616"],m:["Tender","Wistful"],d:"An artificial friend watches closely and learns what devotion costs."},
{id:5,t:"Circe",a:"Madeline Miller",c:["#35504F","#14232a"],m:["Furious","Hopeful"],d:"The witch of Aiaia tells her own side, one exile at a time."},
{id:6,t:"The Remains of the Day",a:"Kazuo Ishiguro",c:["#6B5B4A","#2c241c"],m:["Wistful","Tender"],d:"A butler drives west and reviews a lifetime of quiet loyalty."},
{id:7,t:"Jane Eyre",a:"Charlotte Brontë",c:["#7A3B34","#2c1512"],m:["Furious","Hopeful"],d:"Reader, she did not simply marry him."},
{id:8,t:"Station Eleven",a:"Emily St. John Mandel",c:["#3F5E4C","#1a2b22"],m:["Cozy","Hopeful","Wistful"],d:"After the collapse, a travelling symphony insists that survival is not enough."}];
const MOODS=["Wrecked","Cozy","Haunted","Hopeful","Restless","Tender","Furious","Wistful"];
const SVG={};
const AV=["#294638","#9E4A31","#5F5E3E","#4A3F36"];
const PL={paper:"ivory",mint:"olive",plum:"clay",sky:"linen"},SL={leaf:"olive leaf",bloom:"maple",star:"fern"};
Object.assign(SVG,{leaf:'<svg viewBox="0 0 40 40"><path d="M5 35C4 17 15 5 35 5c1 19-9 31-30 30Z" fill="#85845B"/><path d="M5 35 29 11M15 25l-1-8M20 20l-1-8M18 27h8M24 21h7" stroke="#FFFAF1" stroke-opacity=".6" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>',bloom:'<svg viewBox="0 0 40 40"><path d="M20 4l4 9 8-4-3 10 9 1-7 6 4 8-9-2-2 7h-8l-2-7-9 2 4-8-7-6 9-1-3-10 8 4z" fill="#B85F43"/><path d="M20 36V14M20 24l-7-6M20 24l7-6" stroke="#FFFAF1" stroke-opacity=".55" stroke-width="1.2" fill="none"/></svg>',star:'<svg viewBox="0 0 40 40"><path d="M20 38C20 25 22 12 30 3" stroke="#4F6F5A" stroke-width="1.6" fill="none"/><g fill="#4F6F5A"><ellipse cx="24" cy="12" rx="6" ry="2.2" transform="rotate(-30 24 12)"/><ellipse cx="14" cy="16" rx="6" ry="2.2" transform="rotate(25 14 16)"/><ellipse cx="25" cy="22" rx="6" ry="2.2" transform="rotate(-30 25 22)"/><ellipse cx="14" cy="27" rx="6" ry="2.2" transform="rotate(25 14 27)"/><ellipse cx="24" cy="31" rx="5" ry="2" transform="rotate(-30 24 31)"/></g></svg>'});
const sprig=()=>'<svg class="sprig" width="110" height="22" viewBox="0 0 110 22" aria-hidden="true"><path d="M2 12C30 9 70 14 108 8" stroke="#85845B" stroke-width="1.4" fill="none"/><g fill="#85845B"><ellipse cx="24" cy="6" rx="7" ry="3" transform="rotate(-25 24 6)"/><ellipse cx="46" cy="17" rx="7" ry="3" transform="rotate(25 46 17)"/><ellipse cx="68" cy="7" rx="7" ry="3" transform="rotate(-25 68 7)"/></g><ellipse cx="92" cy="15" rx="7" ry="3" transform="rotate(25 92 15)" fill="#B85F43"/></svg>';
const bk=id=>B.find(b=>b.id==id);
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let pages=load('mg_pages',[
{id:1,b:1,r:5,moods:["Haunted","Hopeful"],text:"I read the last forty pages on the floor of the hallway because I did not want to leave the house. Kind of the point.",quote:"The beauty of the House is immeasurable; its kindness infinite.",paper:"mint",stk:["leaf"],hand:true,vis:"public",date:"2026-09-14"},
{id:2,b:6,r:4,moods:["Wistful"],text:"Stevens is so polite that his regret has to leak out sideways. I closed the book and rang my father.",quote:"",paper:"sky",stk:["star"],hand:false,vis:"friends",date:"2026-10-02"}]);
let lib=load('mg_lib',{1:"read",6:"read",3:"now",2:"want",8:"want"});
let S={v:(location.hash||"#home").slice(1),book:null,jp:0,tab:"all",mood:"",q:"",d:null,dir:"",join:load('mg_join',{}),poll:load('mg_poll',null),fresh:false,open:false,bs:"closed",pi:0,m:false,auto:false,pv:"l",goal:null};
if(!/^(home|discover|library|create|community|profile|mystery)$/.test(S.v))S.v="home";
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cover=(b,s="")=>`<div class="cvw ${s}" title="${b.m.join(', ')} · ${b.p} pages"><div class="cv v${b.id%3}" style="background:linear-gradient(160deg,${b.c[0]},${b.c[1]})"><div><span>${b.t}</span><small>${b.a}</small></div><i class="cm"></i></div></div>`;
const bkBtn=(b,s="")=>`<button class="bk" data-a="book" data-id="${b.id}" aria-label="${esc(b.t)}">${cover(b,s)}</button>`;
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)};

function pageHTML(p,cls=""){const b=bk(p.b),lay=p.lay||"bot",col=MC[p.moods[0]];
return `<article class="pg ${p.paper} lay-${lay} ${cls}" style="${col?`--pa:${col};`:""}transform:rotate(${(p.id%3-1)*.4}deg)"><div class="row ph">${cover(b,"sm")}<div><h3>${b.t}</h3><div class="mute">${b.a}</div><div class="stars" aria-label="${p.r} of 5 stars">${stars(p.r)}</div></div></div>
<div class="mchips">${p.moods.map(m=>`<span class="chip on">${m}</span>`).join("")}</div>
<div class="txt ${p.hand?"hand":""}">${esc(p.text)||'<span class="mute">Your words land here.</span>'}</div>
${p.quote?`<blockquote class="hand pq">${esc(p.quote)}</blockquote>`:""}
${p.where||(p.rem&&!cls.includes("bk"))?`<div class="ann hand">${p.where?`<p>Finished: ${esc(p.where)}</p>`:""}${p.rem&&!cls.includes("bk")?`<p>To remember: ${esc(p.rem)}</p>`:""}</div>`:""}
<div class="stk">${(p.stk||[]).map(s=>SVG[s]||"").join("")}</div><footer class="mute"><b class="folio">${folio(p)}</b>${fmt(p.date)} · ${p.vis==="public"?"Set to public":p.vis==="friends"?"Friends only":"Private"}</footer></article>`}

const NAV=[["home","Home","⌂"],["discover","Discover","✦"],["library","My library","▤"],["create","Write a page","＋"],["community","Community","☺"],["profile","Journal","❦"]];
function nav(){document.getElementById("nav").innerHTML=`<div class="logo">${LOGO}${BRAND}</div>`+
NAV.map(([k,l,i])=>`<button data-a="go" data-v="${k}" class="${S.v===k?"on":""} ${k==="create"?"cta":""}" ${S.v===k?'aria-current="page"':""} aria-label="${l}"><span aria-hidden="true">${i}</span><span class="${k==="create"?"lbl":""}">${k==="create"?"Write a page":l}</span></button>`).join("")+
`<div class="sp"></div><button data-a="go" data-v="mystery" class="study ${S.v==="mystery"?"on":""}"><span aria-hidden="true">🗝</span><span>The Study</span></button>`}

const V={};
/* ---- v4 interactive layer ---- */
if(!Array.isArray(pages))pages=[];pages=pages.filter(p=>p&&bk(p.b)&&Array.isArray(p.moods));
if(typeof lib!=="object"||Array.isArray(lib))lib={};
let rxn=load('mg_rx',{}),bm=load('mg_bm',{}),notes=load('mg_notes',{}),upd=load('mg_upd',{}),pref=load('mg_pref',{lv:'grid',sort:'upd'});
const PGS={1:272,2:559,3:380,4:303,5:393,6:258,7:507,8:333};B.forEach(b=>b.p=PGS[b.id]);
const MC={Wrecked:"#9E4A31",Cozy:"#B85F43",Haunted:"#294638",Hopeful:"#5F5E3E",Restless:"#6B4F3A",Tender:"#85845B",Furious:"#7E2F22",Wistful:"#4F6F5A"};
const PR=["What did the last page make you want to do?","Which character would you phone first, and why?","What kind of light does this book belong in?","What do you want to remember about this book in a year?","Which sentence did you read twice?","Who should read this next, and what should they know first?","What did you expect that never came?"];
const prompt=()=>PR[new Date().getDate()%PR.length];
const SORTED=()=>[...pages].sort((a,b)=>a.date.localeCompare(b.date));
Object.assign(SVG,{stamp:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#9E4A31" stroke-width="2"/><circle cx="20" cy="20" r="12" fill="none" stroke="#9E4A31" stroke-dasharray="2 2"/><text x="20" y="24" text-anchor="middle" font-size="9" font-family="Fraunces,serif" fill="#9E4A31">READ</text></svg>',tape:'<svg viewBox="0 0 40 40"><rect x="3" y="12" width="34" height="16" fill="#C9C39A" opacity=".9" transform="rotate(-8 20 20)"/></svg>'});
Object.assign(SL,{stamp:"stamp",tape:"tape"});
const D0=b=>({hl:[],chars:[],moment:"",photo:"",b,r:0,moods:[],text:"",quote:"",paper:"paper",stk:[],hand:true,vis:"public",date:new Date().toISOString().slice(0,10),lay:"bot",where:"",rem:""});
const loadDraft=bid=>{const x=load("mg_draft",null);if(x&&typeof x==="object"&&bk(x.b)&&Array.isArray(x.moods)&&Array.isArray(x.stk)&&(!bid||x.b==bid))return{...D0(x.b),...x};return D0(bid||(B.find(b=>lib[b.id]==="now")||B[0]).id)};
const topMoods=()=>{const c={};pages.forEach(p=>p.moods.forEach(m=>c[m]=(c[m]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1])};
const LEN=b=>b.p<300?"s":b.p>400?"l":"m";
const quizHTML=()=>{const Q=S.quiz;let r="";
if(Q.m&&Q.l){const sc=B.map(b=>({b,s:(b.m.includes(Q.m)?2:0)+(LEN(b)===Q.l?1:0)})).sort((a,c)=>c.s-a.s).slice(0,3);
r=`<div class="row wrap" style="margin-top:16px">${sc.map(({b})=>`<div class="row" style="flex:1;min-width:220px">${bkBtn(b,"sm")}<div><b>${b.t}</b><p class="mute" style="margin:2px 0 6px;font-size:.88rem">${b.m.includes(Q.m)?"Feels "+Q.m.toLowerCase():"Not quite "+Q.m.toLowerCase()} · ${b.p} pages</p><button class="btn ghost sm" data-a="status" data-id="${b.id}" data-s="want" ${lib[b.id]?"disabled":""}>${lib[b.id]?"On your shelf":"Want to read"}</button></div></div>`).join("")}</div>`}
return `<div class="card quiz"><b>Find my next read</b><p class="mute" style="margin:2px 0 8px">Matches use each book’s moods and page count. Pick both.</p><div>${MOODS.map(m=>`<button class="chip ${Q.m===m?"on":""}" data-a="qm" data-m="${m}">${m}</button>`).join("")}</div><div>${[["s","Under 300 pages"],["m","300 to 400"],["l","Over 400"]].map(([k,l])=>`<button class="chip ${Q.l===k?"on":""}" data-a="ql" data-l="${k}">${l}</button>`).join("")}</div>${r}</div>`};
const insights=()=>{const n=pages.length;if(n<2)return `<p class="mute">Insights appear once you’ve kept two pages.</p>`;
const avg=(pages.reduce((a,p)=>a+p.r,0)/n).toFixed(1),top=topMoods()[0],fin=B.filter(b=>lib[b.id]==="read").length;
return `<dl class="ins"><div><dt>Pages kept</dt><dd>${n}</dd></div><div><dt>Books finished</dt><dd>${fin}</dd></div><div><dt>Average rating</dt><dd>${avg}</dd></div><div><dt>Most felt</dt><dd>${top?top[0]:"—"}</dd></div></dl>`};
const mine=()=>{const top=topMoods().slice(0,3),now=B.find(b=>lib[b.id]==="now"),want=B.find(b=>lib[b.id]==="want");
return `<div class="hb mine"><div><h2>What your pages feel like</h2>${top.length?top.map(([m,n])=>`<span class="chip on" style="--pa:${MC[m]}">${m} · ${n}</span>`).join(""):`<p class="mute">Write a page and your moods will gather here.</p>`}</div>
<div><h2>Continue your journey</h2>${now?`<p>You’re reading <b>${now.t}</b>.</p><button class="btn pers sm" data-a="finish" data-id="${now.id}">I finished it</button>`:want?`<p>Next on your shelf: <b>${want.t}</b>.</p><button class="btn ghost sm" data-a="status" data-id="${want.id}" data-s="now">Start reading</button>`:`<p class="mute">Your shelves are empty.</p><button class="btn ghost sm" data-a="go" data-v="discover">Find a book</button>`}</div>
<div><h2>Today’s prompt</h2><p class="hand" style="margin-top:0">${prompt()}</p><button class="btn ghost sm" data-a="go" data-v="create">Write a page</button>${bm.mira1?`<p class="mute" style="margin-top:14px">Saved for later: Mira’s page (sample) <button class="tab" data-a="bm" data-k="mira1">Remove</button></p>`:""}</div></div>`};
/* demonstration page from a sample reader; never part of the user's saved journal */
const SAMPLE_PAGE={id:9001,b:1,r:5,moods:["Haunted","Hopeful"],text:"I read the last forty pages on the floor of the hallway because I did not want to leave the house. Kind of the point.",quote:"The beauty of the House is immeasurable; its kindness infinite.",paper:"mint",stk:["leaf"],hand:true,vis:"public",date:"2026-09-14",lay:"bot"};
const LOGO='<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 34C5 16 16 5 35 5c1 19-10 31-29 29Z" fill="#C9C58F"/><path d="M6 34 30 10M14 26h9M19 20h9" stroke="#294638" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M28 5v10l3-2 3 2V6" fill="#D98466"/></svg>';
const rule=()=>'<div class="rule" aria-hidden="true">'+SVG.leaf.replace('<svg','<svg width="22" height="22"')+'</div>';
const folio=p=>{const s=[...pages].sort((a,b)=>a.date.localeCompare(b.date)),i=s.findIndex(q=>q.id===p.id);return i<0?"·":i+1};
const shortDate=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{month:"short",year:"2-digit"});

V.home=()=>{const day=new Date().toLocaleDateString("en-GB",{weekday:"long"}),now=B.find(b=>lib[b.id]==="now"),fp=SAMPLE_PAGE,voted=S.poll;

const $=id=>document.getElementById(id),RM=()=>!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches),isM=()=>!!(window.matchMedia&&matchMedia("(max-width:860px)").matches);

function rightHTML(p){const b=bk(p.b),hl=arr(p.hl).slice(0,5),ch=arr(p.chars).slice(0,4),has=hl.length||ch.length||p.moment||okPhoto(p.photo)||p.rem;
return `<article class="pg paper rt" style="${MC[p.moods[0]]?`--pa:${MC[p.moods[0]]}`:""}"><h3 class="hand rth">Between the lines</h3>
${hl.length?`<ul class="hl hand">${hl.map(h=>`<li><mark>${esc(h)}</mark></li>`).join("")}</ul>`:""}
${ch.length?`<div><span class="hand mute">Characters I loved</span><div class="chars">${ch.map((c,i)=>`<span class="note n${i%3}">${esc(c)}</span>`).join("")}</div></div>`:""}
${p.moment?`<div class="note moment"><small>A moment I won’t forget</small>${esc(p.moment)}</div>`:""}
${okPhoto(p.photo)?`<figure class="polaroid"><img src="${p.photo}" alt="A photograph kept with this page"><figcaption class="hand">${esc(b.t)}</figcaption></figure>`:""}
${p.rem?`<p class="hand marg">${esc(p.rem)}</p>`:""}
${has?"":`<p class="hand mute empty-r">Highlights, favourite characters and moments you add will gather here.</p>`}
<span class="press" aria-hidden="true">${SVG.leaf}</span><span class="press p2" aria-hidden="true">${SVG.bloom}</span></article>`}

 if(!it)h=`<div class="pg paper"><span class="press" aria-hidden="true">${SVG.leaf}</span></div>`;
 else if(it.k==="wait")h=`<div class="pg paper waiting"><div class="emp">${bigLogo(48)}<p class="hand">The next page is waiting.</p><button class="btn pers" data-a="go" data-v="create">Write a page</button></div></div>`;

function readPhoto(f){if(!f||!/^image\//.test(f.type)||!S.d)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);try{S.d.photo=c.toDataURL("image/jpeg",.7);render();toast("Photo added to the page")}catch(e){toast("Couldn’t read that photo")}};im.onerror=()=>toast("Couldn’t read that photo");im.src=r.result};r.readAsDataURL(f)}
const ctlHTML=()=>{if(S.bs==="closed")return `<span class="hand mute">Click the cover to open</span>`;
 const it=bookItems(),c=bkCur(),mx=bkMax(it),ok=S.bs==="open";
 return `<button class="btn ghost sm" data-a="bprev" aria-label="Previous page" ${ok&&c>0?"":"disabled"}>‹ Previous</button><span class="mute">${S.m?"Page":"Spread"} ${c+1} of ${mx+1} · <span class="hand">Turn the page</span></span><button class="btn ghost sm" data-a="bnext" aria-label="Next page" ${ok&&c<mx?"":"disabled"}>Next ›</button><button class="btn ghost sm" data-a="closebook" ${ok?"":"disabled"}>Close the book</button><button class="btn ghost sm" data-a="editpage" ${ok&&Math.floor(S.pi/2)<SORTED().length?"":"disabled"}>Add to this page</button>`};
function setBS(x){S.bs=x;const st=$("stage");if(st)st.className=stCls();const c=$("bkctl");if(c)c.innerHTML=ctlHTML()}

function openBook(){if(S.bs!=="closed"||!$("book"))return;setBS("opening");setTimeout(()=>{if(S.bs==="opening"){setBS("open");if(S.goal!=null){const g=S.goal;S.goal=null;riffleTo(g)}}},RM()?0:T_OPEN)}
function closeBook(){if(S.bs!=="open")return;setBS("closing");setTimeout(()=>{if(S.bs==="closing")setBS("closed")},RM()?0:T_CLOSE)}
function turnTo(t){if(S.bs!=="open"||!$("book"))return;const it=bookItems(),M=S.m,mx=bkMax(it),c=bkCur();t=Math.max(0,Math.min(mx,t));if(t===c)return;
 const fwd=t>c,o=bkSp(it,c),n=bkSp(it,t),leaf=$("leaf"),lf=$("lf"),lb=$("lb"),back=`<div class="sheet l"><i class="gut"></i><i class="shade"></i></div>`;
 setBS("turning");S.pi=M?t:2*t;
 if(fwd){$("rp").innerHTML=face(n.R,"r");lf.innerHTML=face(o.R,"r");lb.innerHTML=M?back:face(n.L,"l")}
 else{if(!M)$("lp").innerHTML=face(n.L,"l");lb.innerHTML=M?back:face(o.L,"l");lf.innerHTML=face(n.R,"r")}
 leaf.className="leaf on "+(fwd?"fwd":"bwd");
 setTimeout(()=>{if(!$("book"))return;fillFaces();leaf.className="leaf";setBS("open")},RM()?0:T_TURN)}
/* Riffle: several real leaves (showing the actual pages passing by) flip in quick succession and land on spread t */
function riffleTo(t){if(S.bs!=="open"||!$("book"))return;const it=bookItems(),M=S.m,mx=bkMax(it),c=bkCur();t=Math.max(0,Math.min(mx,t));if(t===c)return;
 if(Math.abs(t-c)===1)return turnTo(t);
 const fwd=t>c,span=Math.abs(t-c),m=Math.min(span,7),book=$("book"),o=bkSp(it,c),n=bkSp(it,t),blank=`<div class="sheet l"><i class="gut"></i></div>`,leaves=[];
 setBS("turning");S.pi=M?t:2*t;
 if(fwd)$("rp").innerHTML=face(n.R,"r");else if(!M)$("lp").innerHTML=face(n.L,"l");
 for(let k=0;k<m;k++){const a=Math.floor(k*span/m),d=fwd?c+a:c-a,e=fwd?bkSp(it,d):bkSp(it,d-1),g=fwd?bkSp(it,d+1):bkSp(it,d);
  const front=fwd?(k===0?o.R:e.R):(k===m-1?n.R:e.R),back=M?blank:fwd?(k===m-1?n.L:g.L):(k===0?o.L:g.L);
  const el=document.createElement("div");el.className="leaf on rf "+(fwd?"qf":"qb");el.style.cssText=`--z:${(6+(fwd?k:m-k)*.6).toFixed(1)}px;animation-delay:${k*110}ms`;
  el.innerHTML=`<div class="face f">${face(front,"r")}</div><div class="face b">${M?blank:face(back,"l")}</div>`;book.appendChild(el);leaves.push(el)}
 const end=()=>{leaves.forEach(l=>l.remove&&l.remove());if(!$("book"))return;fillFaces();setBS("open")};
 if(RM())end();else setTimeout(end,(m-1)*110+620)}

function openEntry(i){window.scrollTo(0,0);if(S.v==="profile"&&$("book"))showEntry(i);else{S.m=isM();S.pi=0;S.goal=S.m?2*i:i;S.bs="closed";S.auto=true;S.v="profile";render()}}

<label>Paper</label><div>${["paper","mint","plum","sky"].map(q=>`<button class="chip ${d.paper===q?"on":""}" data-a="cpaper" data-p="${q}" aria-pressed="${d.paper===q}">${PL[q]}</button>`).join("")}</div>
<label>Decorations</label><div>${Object.keys(SVG).map(k=>`<button class="chip ${d.stk.includes(k)?"on":""}" data-a="cstk" data-s="${k}" aria-pressed="${d.stk.includes(k)}">${SL[k]}</button>`).join("")}</div>
${d.stk.length?`<p class="mute" style="margin:8px 0 0">Order: ${d.stk.map((k,i)=>`<span class="ord">${SL[k]}<button class="mv" data-a="smove" data-i="${i}" data-d="-1" aria-label="Move ${SL[k]} earlier">‹</button><button class="mv" data-a="smove" data-i="${i}" data-d="1" aria-label="Move ${SL[k]} later">›</button></span>`).join("")}</p>`:""}
<label for="cv">Who can see this</label><select id="cv">${[["public","Everyone"],["friends","Friends only"],["me","Only me"]].map(([v,l])=>`<option value="${v}" ${d.vis===v?"selected":""}>${l}</option>`).join("")}</select>
<div class="tools" style="margin-top:20px"><button class="btn" data-a="save">${d.id?"Save changes":"Add to my journal"}</button><button class="btn ghost" data-a="discard">Clear draft</button></div><p class="mute" style="font-size:.85rem;margin:0">Drafts save automatically on this device. Visibility is a saved preference; sharing arrives with an account system.</p></div>
<div id="cp" style="position:sticky;top:20px"></div></div>`};
const cprev=()=>{if(!S.d)return;if(!S.d.id)save("mg_draft",S.d);const e=document.getElementById("cp");if(e)e.innerHTML='<div class="tools" style="justify-content:center"><button class="chip '+(S.pv!=="r"?"on":"")+'" data-a="pv" data-v="l">Left page</button><button class="chip '+(S.pv==="r"?"on":"")+'" data-a="pv" data-v="r">Right page</button></div>'+(S.pv==="r"?rightHTML({...S.d,id:0}):pageHTML({...S.d,id:0}))+'<p class="hand mute" style="text-align:center;margin:14px 0 0">Your page, as it will be kept</p>'};

V.community=()=>{const cl=[["The Slow Readers","Rebecca","412 readers"],["Late Night Gothic","The Secret History","1.2k readers"],["Quiet Books","Klara and the Sun","236 readers"]];
return `<div class="top"><h1>Your reading people</h1></div><div class="feed">${cl.map(([n,b,r],i)=>`<div class="card ${i%2?"tilt2":""}"><h3>${n}</h3><p class="mute">Reading <i>${b}</i> · ${r}</p><button class="btn ${S.join[n]?"ghost":""} sm" data-a="join" data-n="${n}">${S.join[n]?"Joined":"Join the club"}</button></div>`).join("")}<div class="card span2"><b>Friends reading now</b><div class="row wrap" style="margin-top:12px">${[["Mira",3],["Jonas",6],["Ana",8]].map(([n,i],k)=>`<div class="row" style="align-items:center"><span class="av" style="background:${AV[k]}">${n[0]}</span><span>${n} · ${bk(i).t}</span></div>`).join("")}</div></div></div>`};


function render(){const m=document.getElementById("main");m.innerHTML=(V[S.v]||V.home)();nav();if(S.v==="create")cprev();S.dir="";if(S.v==="profile"&&S.auto){S.auto=false;setTimeout(()=>{if(S.v==="profile"&&S.bs==="closed")openBook()},700)}}
function go(v,b){S.v=v;S.placed=null;S.bs="closed";S.goal=null;if(b)S.book=b;else if(v==="create")S.book=null;if(v!=="create"){S.d=null;S.fresh=false}try{history.replaceState(null,"","#"+(v==="book"?"discover":v))}catch(e){}render();window.scrollTo(0,0)}
function finish(id){S.placed=null;S.d=null;S.book=bk(id);S.fresh=true;S.v="create";render();window.scrollTo(0,0)}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const D=t.dataset,a=D.a;
if(a==="go")go(D.v);
else if(a==="book")go("book",bk(D.id));
else if(a==="finish")finish(D.id);
else if(a==="status"){lib[D.id]=D.s;upd[D.id]=Date.now();save("mg_lib",lib);save("mg_upd",upd);if(D.s==="read"){finish(D.id)}else{render();toast("Moved to your shelf")}}
else if(a==="mood"){S.mood=S.mood===D.m?"":D.m;render()}
else if(a==="poll"){S.poll=+D.i;save("mg_poll",S.poll);render()}
else if(a==="star"){S.d.r=+D.n;document.querySelectorAll("#cs b").forEach((b,i)=>b.classList.toggle("f",i<S.d.r));cprev()}
else if(a==="cmood"){const m=S.d.moods,i=m.indexOf(D.m);i<0?m.push(D.m):m.splice(i,1);render()}
else if(a==="cpaper"){S.d.paper=D.p;document.querySelectorAll('[data-a=cpaper]').forEach(b=>b.classList.toggle("on",b===t));cprev()}
else if(a==="cstk"){const k=S.d.stk,i=k.indexOf(D.s);i<0?k.push(D.s):k.splice(i,1);render()}
else if(a==="save"){if(!S.d.r){toast("Give it a star rating first");return}
 const ed=S.d.id?pages.findIndex(q=>q.id===S.d.id):-1,np=ed>=0?{...S.d}:{id:Date.now(),...S.d};if(ed>=0)pages[ed]=np;else pages.push(np);lib[np.b]="read";upd[np.b]=Date.now();save("mg_pages",pages);save("mg_lib",lib);save("mg_upd",upd);save("mg_draft",null);S.placed=np;S.d=null;S.fresh=false;render();window.scrollTo(0,0);toast("Page placed in your journal")}
else if(a==="another"){S.placed=null;S.d=null;S.book=null;render()}
else if(a==="pv"){S.pv=D.v;cprev()}
else if(a==="rmphoto"){S.d.photo="";render()}
else if(a==="editpage"){const q=SORTED()[Math.floor(S.pi/2)];if(!q)return;S.d={...D0(q.b),...q};S.book=null;S.fresh=false;S.v="create";render();window.scrollTo(0,0)}
else if(a==="openbook")openBook();
else if(a==="closebook")closeBook();
else if(a==="bprev")turnTo(bkCur()-1);
else if(a==="bnext")turnTo(bkCur()+1);
else if(a==="jumpopen")openEntry(+D.n);
else if(a==="viewplaced"){const i=SORTED().findIndex(p=>p.id===S.placed.id);S.placed=null;S.tab="all";openEntry(i)}
else if(a==="shuffle"){if(!pages.length){toast("No pages yet. Write your first one.");return}openEntry(Math.floor(Math.random()*pages.length));toast("A page from your journal")}
else if(a==="discard"){save("mg_draft",null);S.d=null;render();toast("Draft cleared")}
else if(a==="lay"){S.d.lay=D.l;render()}
else if(a==="smove"){const k=S.d.stk,i=+D.i,j=i+ +D.d;if(j>=0&&j<k.length)[k[i],k[j]]=[k[j],k[i]];render()}
else if(a==="react"||a==="bm"){const m=a==="react"?rxn:bm;m[D.k]=!m[D.k];save(a==="react"?"mg_rx":"mg_bm",m);render();toast(a==="react"?(m[D.k]?"You appreciated this page":"Reaction removed"):(m[D.k]?"Saved for later":"Removed from saved"))}
else if(a==="surprise"){const c=B.filter(b=>!lib[b.id]),pl=c.length?c:B,b=pl[Math.floor(Math.random()*pl.length)];go("book",b);toast("Here’s one from the shelves")}
else if(a==="quiz"){S.quiz=S.quiz?null:{m:"",l:""};render()}
else if(a==="qm"){S.quiz.m=D.m;render()}else if(a==="ql"){S.quiz.l=D.l;render()}
else if(a==="lf"){S.lf=D.f;render()}
else if(a==="lview"){pref.lv=D.v;save("mg_pref",pref);render()}
else if(a==="tab"){S.tab=D.t;S.jp=0;render()}
else if(a==="join"){S.join[D.n]=!S.join[D.n];save("mg_join",S.join);render()}
else if(a==="share")toast("Sharing links arrive with the backend")});
document.addEventListener("input",e=>{const i=e.target.id;
if(i.startsWith("n-")){notes[i.slice(2)]=e.target.value;save("mg_notes",notes);return}
if(i==="lsort"){pref.sort=e.target.value;save("mg_pref",pref);render();return}
if(i==="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p);return}
const d=S.d;if(!d||S.v!=="create")return;
if(i==="ct")d.text=e.target.value;else if(i==="cq")d.quote=e.target.value;else if(i==="ch")d.hand=e.target.checked;else if(i==="cb")d.b=+e.target.value;else if(i==="cv")d.vis=e.target.value;else if(i==="chl")d.hl=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,5);else if(i==="cch")d.chars=e.target.value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,4);else if(i==="cmo")d.moment=e.target.value;else if(i==="cw")d.where=e.target.value;else if(i==="cr")d.rem=e.target.value;
cprev()});
document.addEventListener("keydown",e=>{const t=e.target,tg=t&&t.tagName||"";if(/INPUT|TEXTAREA|SELECT/.test(tg))return;
 if((e.key==="Enter"||e.key===" ")&&t.getAttribute&&t.getAttribute("role")==="button"&&t.dataset&&t.dataset.a){e.preventDefault();t.click();return}
 if(S.v!=="profile"||!$("book"))return;
 if(e.key==="ArrowRight")turnTo(bkCur()+1);else if(e.key==="ArrowLeft")turnTo(bkCur()-1);else if(e.key==="Escape")closeBook()});
document.addEventListener("change",e=>{if(e.target.id==="cph"&&S.d)readPhoto(e.target.files&&e.target.files[0])});
try{matchMedia("(max-width:860px)").addEventListener("change",()=>{if(S.v==="profile"&&(S.bs==="closed"||S.bs==="open"))render()})}catch(e){}
render();
</script>
</body>
</html>
